ente 2: el celular siempre completo y quieto. Cada momento clave sale\n     de la pantalla hacia un lado, se sostiene y vuelve a su sitio exacto. */\n  /* Un cue por momento del texto. El scroll de la página recorre los cuatro\n     tramos sin reiniciar: el aparato es el mismo de principio a fin. */\n  /* Un momento por frase del texto, y cada uno saca su bloque del aparato.\n     Los cuartos del recorrido coinciden con las cuatro secciones de la página. */\n  /* Un momento por frase del texto, y cada uno saca su bloque del aparato.\n     Los cuartos del recorrido coinciden con las cuatro secciones de la página. */\n  /* Primero la conversación, después la ficha donde queda guardada. */\n  /* Escena estática: la ficha se queda abierta y quieta; lo que ocurre son las\n     cuatro tarjetas que entran encima, en el orden en que el texto las nombra. */\n  CUES = [\n    [0, { view: 'ficha', msgN: 4, escribiendo: false, hist: false, tap: null, pop: null, scroll: 0, hl: null }]\n  ];\n  LOOP = 8600;\n\n  POPS = {\n    /* solo lo que nombra este texto */\n    datos:    { sel: '.phone-row', dy: 0, hold: 1700, radius: 16 },\n    cita:     { sel: '.next-cita', dy: -2, hold: 1700, radius: 16 },\n    hist:     { sel: 'bw-hist', dy: -10, hold: 2100, radius: 18 }\n  };\n\n\n  /* El punto del toque se mide sobre el elemento vivo justo antes de pintarlo:\n     con coordenadas fijas el anillo se despega en cuanto cambia el scroll, el\n     acordeón se abre o el contenido crece. */\n  tapTarget(key) {\n    const stage = this.rootRef.current;\n    if (!stage) return null;\n    if (key === 'tags') return this.tagsRef.current && this.tagsRef.current.querySelector('.acc-h');\n    if (key === 'hist') return this.histRef.current && this.histRef.current.querySelector('.acc-h');\n    if (key === 'fotos') return this.fotosRef.current && this.fotosRef.current.querySelector('.acc-h');\n    return [...stage.querySelectorAll('.ccard')].find(e => e.textContent.indexOf('Luisa') >= 0);\n  }\n\n  measureTap(key) {\n    const el = this.tapTarget(key), dv = this.dvRef.current;\n    if (!el || !dv) { this.tapPt = null; return; }\n    const b = dv.getBoundingClientRect(), r = el.getBoundingClientRect();\n    if (!r.width || !dv.offsetWidth) { this.tapPt = null; return; }\n    /* escala AMBIENTE real (ajuste del teléfono × zoom de cámara), medida sobre\n       el propio dispositivo: usar sólo state.scale desplazaba el anillo */\n    const s = b.width / dv.offsetWidth;\n    this.tapPt = [\n      Math.round((r.left + r.width / 2 - b.left) / s),\n      Math.round((r.top + r.height / 2 - b.top) / s)\n    ];\n  }\n\n  componentDidMount() {\n    this.dead = false;\n    this.fit();\n    this.ro = new ResizeObserver(() => this.fit());\n    if (this.rootRef.current) this.ro.observe(this.rootRef.current);\n    this.onResize = () => this.fit();\n    window.addEventListener('resize', this.onResize);\n    requestAnimationFrame(() => this.fit());\n    this.listen();\n    if ((this.props.reproducir ?? true) === false) {\n      this.frozen = true;\n      this.setState({ view: 'ficha', hist: false, msgN: MSGS.length });\n    } else { this.run(); }\n  }\n  componentDidUpdate(prev, prevState) {\n    /* el alto de un acordeón recién abierto no existe hasta el frame siguiente */\n    if (prevState && (prevState.tags !== this.state.tags || prevState.hist !== this.state.hist || prevState.fotos !== this.state.fotos)) {\n      requestAnimationFrame(() => { this.lastScroll = null; this.sync(); });\n    }\n    /* el prop permite revisar a mano un punto concreto del guion */\n    this.arm(); this.sync();\n    const tk = this.state.tap;\n    if (tk !== this.firedTap) {\n      this.firedTap = tk;\n      if (tk) { this.measureTap(tk); this.forceUpdate(); } else { this.tapPt = null; }\n    }\n    const k = this.state.pop;\n    if (k !== this.firedPop) {\n      this.firedPop = k;\n      if (k) requestAnimationFrame(() => requestAnimationFrame(() => this.firePop(k)));\n    }\n  }\n  componentWillUnmount() {\n    this.dead = true;\n    this.ro && this.ro.disconnect();\n    if (this.onResize) window.removeEventListener('resize', this.onResize);\n    if (this.onVis) document.removeEventListener('visibilitychange', this.onVis);\n    if (this.onMsg) window.removeEventListener('message', this.onMsg);\n    this.clear();\n  }\n  clear() {\n    if (this.timer) clearInterval(this.timer);\n    if (this.raf) cancelAnimationFrame(this.raf);\n    this.timer = null; this.raf = null;\n  }\n  arm() { if (!this.timer && !this.frozen && !this.dead) this.run(); }\n\n  tick() {\n    if (this.dead || this.frozen) return;\n    const sp = this.props.velocidad ?? 1;\n    const phase = ((performance.now() - this.t0) * sp) % this.LOOP;\n    /* las tarjetas entran por fase, no por cue: repinta cuando cambia el número */\n    const shown = this.cardsShown();\n    if (shown !== this._cs) { this._cs = shown; this.forceUpdate(); }\n    const next = {};\n    for (let i = 0; i < this.CUES.length; i++) {\n      if (this.CUES[i][0] <= phase) Object.assign(next, this.CUES[i][1]); else break;\n    }\n    for (const k in next) {\n      if (this.state[k] !== next[k]) { this.setState(next); return; }\n    }\n  }\n\n  run() {\n    this.clear();\n    if (this.t0 == null) this.t0 = performance.now();\n    if (!this.onVis) { this.onVis = () => this.arm(); document.addEventListener('visibilitychange', this.onVis); }\n    const frame = () => { this.fit(); this.tick(); this.sync(); this.raf = requestAnimationFrame(frame); };\n    this.raf = requestAnimationFrame(frame);\n    this.timer = setInterval(() => { this.fit(); this.tick(); }, 200);\n  }\n\n  /* Guiada por el scroll: la sección de la página es un bloque anclado, así que\n     el anfitrión manda su avance (0→1) y la escena enseña exactamente lo que el\n     texto está diciendo en ese punto. Si no llega ningún mensaje, se reproduce\n     sola, de modo que el archivo sigue sirviendo suelto.\n\n       iframe.contentWindow.postMessage({type:'bewe-scene-progress', value:p}, '*')\n\n     También acepta el prop `progreso` para revisarla a mano. */\n  seekTo(p) {\n    const phase = Math.max(0, Math.min(1, p)) * this.LOOP;\n    const next = {};\n    for (let i = 0; i < this.CUES.length; i++) {\n      if (this.CUES[i][0] <= phase) Object.assign(next, this.CUES[i][1]); else break;\n    }\n    for (const k in next) {\n      if (this.state[k] !== next[k]) { this.setState(next); return; }\n    }\n  }\n\n  listen() {\n  }\n\n  /* el celular se ve ENTERO y centrado, con aire para que el pop pueda salirse */\n  fit() {\n    const el = this.rootRef.current; if (!el) return;\n    const availW = Math.max(160, el.clientWidth || 0);\n    const availH = Math.max(160, el.clientHeight || 0);\n    /* en la escena compuesta el celular se ve entero y pequeño; el monitor lleva su propia escala */\n    /* el aparato se ve entero: la caja manda por el lado más estrecho */\n    const dk = 1;\n    /* deja aire a los lados: los bloques salen del aparato */\n    const next = Math.min(availW * 0.72 / 390, availH / 600);\n    if (Math.abs(next - (this.state.scale || 0)) > 0.002\n      || Math.abs(dk - (this.state.deskScale || 0)) > 0.002) this.setState({ scale: next, deskScale: dk });\n  }\n\n  /* Un cue puede pedir un número de px o el nombre de un bloque: en ese caso el\n     destino se calcula para dejar ese bloque centrado en pantalla, de modo que\n     el pop no aterrice sobre algo pegado al borde inferior. */\n  sync() {\n    const sc = this.scRef.current;\n    if (!sc) return;\n    const want = this.state.scroll || 0;\n    if (this.lastScroll === want) return;\n    let top = want;\n    if (typeof want === 'string') {\n      const SEL = {\n        cita: '.next-cita', resumen: '.resumen', datos: '.phone-row',\n        tagsHead: '.acc:first-of-type', tags: '.acc:first-of-type .acc-b',\n        histHead: '.acc:nth-of-type(2)', hist: '.acc:nth-of-type(2) .acc-b',\n        filtros: '.filters'\n      };\n      const REF = { tagsHead: this.tagsRef, tags: this.tagsRef, histHead: this.histRef, hist: this.histRef, fotosHead: this.fotosRef, fotos: this.fotosRef };\n      const host = REF[want]\n        ? REF[want].current\n        : (this.scRef.current && this.scRef.current.querySelector(SEL[want] || ''));\n      if (!host) return;\n      const hr = host.getBoundingClientRect(), sr = sc.getBoundingClientRect();\n      const s = this.state.scale || 1;\n      top = sc.scrollTop + (hr.top - sr.top) / s - (sc.clientHeight - hr.height / s) / 2;\n      top = Math.max(0, Math.round(top));\n    }\n    this.lastScroll = want;\n    sc.scrollTo({ top, behavior: 'auto' });\n  }\n\n  firePop(key) {\n    const cfg = this.POPS[key];\n    const stage = this.rootRef.current;\n    if (!cfg || !stage || !window.BeweMotion) return;\n    const el = cfg.sel === 'bw-tags' ? this.tagsRef.current\n             : cfg.sel === 'bw-hist' ? this.histRef.current\n             : cfg.sel === 'bw-fotos' ? this.fotosRef.current\n             : stage.querySelector(cfg.sel);\n    if (!el) return;\n    const frame = stage.querySelector('.phone');\n    const sr = stage.getBoundingClientRect(), fr = frame.getBoundingClientRect();\n    const k = this.state.scale || 1;\n    const room = Math.max(8, (Math.min(fr.left - sr.left, sr.right - fr.right) - 6) / k);\n    /* todos salen al mismo ancho: el del aparato más el aire disponible */\n    const w = el.getBoundingClientRect().width / k;\n    const target = (fr.width / k) + Math.min(room, 56);\n    const scale = Math.max(1.06, Math.min(1.9, w > 0 ? target / w : 1.3));\n    window.BeweMotion.pop(this.camRef.current, el, {\n      layer: this.popRef.current, stage, scale, out: cfg.out,\n      frame, overlap: room, dy: cfg.dy,\n      hold: cfg.hold, radius: cfg.radius, shade: this.shadeRef.current\n    });\n  }\n\n  /* cuántas tarjetas se ven, derivado de la fase (idempotente) */\n  cardsShown() {\n    if (this.frozen) return 4;\n    if (this.t0 == null) return 0;\n    const sp = this.props.velocidad ?? 1;\n    const phase = ((performance.now() - this.t0) * sp) % this.LOOP;\n    return Math.min(3, Math.floor(phase / 900));\n  }\n\n  renderVals() {\n    const s = this.state, p = this.props;\n    const view = s.view || 'list';\n    return {\n      up: String(this._cs || 0),\n      /* el historial flotante y su total salen de HIST, la misma fuente que\n         alimenta el acordeón del fondo */\n      historialPop: HIST.slice(0, 2),\n      totalGastado: '$' + HIST.reduce((t, h) => t + (parseFloat(String(h.a).replace(/[^\\d.]/g, '')) || 0), 0).toLocaleString('en-US'),\n      /* las cuatro tarjetas de la escena, en el orden del texto */\n      c1: this._cs > 0 ? 'on' : '', c2: this._cs > 1 ? 'on' : '',\n      c3: this._cs > 2 ? 'on' : '', c4: this._cs > 3 ? 'on' : '',\n      hl: s.hl || false,\n      rootRef: this.rootRef, camRef: this.camRef, popRef: this.popRef,\n      shadeRef: this.shadeRef, dvRef: this.dvRef, scRef: this.scRef,\n      tagsRef: this.tagsRef, histRef: this.histRef,\n      pageBg: BG[p.fondo || 'Transparente'] || 'transparent',\n      scale: s.scale,\n      deskScale: s.deskScale ?? 0.5,\n      showChat: view === 'chat', showFicha: view === 'ficha',\n      threadRef: this.threadRef,\n      mensajes: MSGS.slice(0, s.msgN || 0).map((m, i) => ({\n        id: i, texto: m.texto, hora: m.hora, esLinda: !m.u, dir: m.u ? 'in' : 'out'\n      })),\n      escribiendo: !!s.escribiendo,\n      screenAnim: view === 'list'\n        ? (s.back ? 'bw-screenback .34s cubic-bezier(.2,.8,.2,1) both' : 'none')\n        : 'bw-screenin .34s cubic-bezier(.2,.8,.2,1) both',\n      filtros: [['Todos', 'todas'], ['Con cita hoy', 'hoy'], ['Nuevos', 'nuevas'], ['Inactivos', 'dormidas']]\n        .map(([label, k]) => ({ label, on: (s.filtro || 'todas') === k })),\n      contactos: CONTACTOS.filter(c => {\n        const f = s.filtro || 'todas';\n        return f === 'todas' || (f === 'hoy' && c.hoy) || (f === 'nuevas' && c.estado === 'nueva') || (f === 'dormidas' && c.estado === 'dormida');\n      }).map(c => Object.assign({}, c, {\n        inactivo: !!c.inactivo,\n        press: s.tap === c.id ? 'scale(.965)' : 'none'\n      })),\n      tags: TAGS.map((t, i) => Object.assign({}, t, { d: (0.12 + i * 0.09).toFixed(2) + 's' })),\n      tagNuevaD: (0.12 + TAGS.length * 0.09).toFixed(2) + 's',\n      historial: HIST,\n      showTags: !!s.tags, showHist: !!s.hist, showFotos: !!s.fotos,\n      fotosOpen: s.fotos ? 'open' : '', fotosRef: this.fotosRef,\n      pressFotos: s.tap === 'fotos' ? 'scale(.985)' : 'none',\n      tagsOpen: s.tags ? 'open' : '', histOpen: s.hist ? 'open' : '',\n      tapOn: !!s.tap && !!this.tapPt,\n      tapX: (this.tapPt ? this.tapPt[0] : 0) + 'px',\n      tapY: (this.tapPt ? this.tapPt[1] : 0) + 'px',\n      pressBack: s.tap === 'back' ? 'scale(.82)' : 'none',\n      pressTags: s.tap === 'tags' ? 'scale(.98)' : 'none',\n      pressHist: s.tap === 'hist' ? 'scale(.98)' : 'none'\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
